# BabbleSim functional check only (see CMakeLists.txt): PSA from Zephyr's
# Mbed TLS (software; no Ed25519, so the probe leaves Ed25519 in software).
CONFIG_NRF_SECURITY=n
CONFIG_PSA_CRYPTO_DRIVER_CC3XX=n
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_ENTROPY_POLL_ZEPHYR=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_MBEDTLS_HEAP_SIZE=16384
CONFIG_FPU=n
CONFIG_FPU_SHARING=n
