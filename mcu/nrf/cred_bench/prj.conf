# Timing over the J-Link VCOM (115200 baud).
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PICOLIBC_IO_FLOAT=y

# ML-DSA-87 signing in pqm4's m4f code needs about 108 KB of stack; the
# benchmark runs on the main thread.
CONFIG_MAIN_STACK_SIZE=126976
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_HW_STACK_PROTECTION=n
CONFIG_THREAD_STACK_INFO=y

# PSA crypto on the CryptoCell-310 only, so a "hardware" figure cannot come
# from a software fallback.
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_CRYPTO_DRIVER_CC3XX=y
CONFIG_PSA_CRYPTO_DRIVER_OBERON=n
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ALG_PURE_EDDSA=y
CONFIG_PSA_WANT_ECC_TWISTED_EDWARDS_255=y
CONFIG_SPEED_OPTIMIZATIONS=y
# Random numbers for key generation and ECDSA signing: CTR-DRBG on the
# CryptoCell, seeded from its TRNG.
CONFIG_PSA_WANT_GENERATE_RANDOM=y
CONFIG_PSA_WANT_ALG_CTR_DRBG=y
# Key material in a static buffer, not on the heap (heap allocation failed
# with PSA_ERROR_INSUFFICIENT_MEMORY on the board). 80 bytes holds a P-256
# public key (65 B) or private key (32 B) and the Ed25519 keys.
CONFIG_MBEDTLS_PSA_STATIC_KEY_SLOTS=y
CONFIG_MBEDTLS_PSA_STATIC_KEY_SLOT_BUFFER_SIZE=80
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=4
