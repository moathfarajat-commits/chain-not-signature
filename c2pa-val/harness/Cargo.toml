[package]
name = "lineaval"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
c2pa = { path = "../c2pa-rs/sdk", default-features = false, features = ["rust_native_crypto", "file_io"] }
coset = "0.4.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
sha2 = "0.10"

[patch.crates-io]
c2pa_raw_crypto = { path = "../c2pa_raw_crypto" }

[profile.release]
opt-level = 3
